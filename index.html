<title>에너지 레벨 감지기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 기준의 좁은 계기판 기둥(최대 34rem).
   위에서부터 지난 결과 묻기 한 줄 → 오늘 판정(점수·눈금·계획) → 지금 멈춤 점검 → 날마다 쌓이는 기록.
   체크는 화면 전체를 덮는 4단계 시트에서 한다.
   색은 상태(충분·보통·낮음·바닥)만 말하고, 파랑 두 톤이 신호(진한 점)와 느낌(옅은 고리)을 가른다. */
:root {
  --bg: #f2f5f3;
  --surface: #fbfcfb;
  --surface-2: #e9eeeb;
  --ink: #13201b;
  --ink-2: #48564f;
  --muted: #5d6a64;
  --line: #d9e0dc;
  --line-2: #bfc9c4;
  --accent: #2a63c6;
  --accent-ink: #ffffff;
  --accent-wash: #e1eafa;
  --gut: #5d89d6;
  --gut-on: #5d89d6;
  --gut-on-ink: #0b1a33;
  --good: #0ca30c;
  --neutral: #8a978f;
  --warn: #fab219;
  --crit: #d03b3b;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 16px;
  --r-s: 11px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1311;
    --surface: #161c19;
    --surface-2: #1f2723;
    --ink: #e5ebe8;
    --ink-2: #b0bbb6;
    --muted: #8a9791;
    --line: #29312d;
    --line-2: #3d4743;
    --accent: #6b9ef0;
    --accent-ink: #0a1222;
    --accent-wash: #1a2741;
    --gut: #4f78c0;
    --gut-on: #7da2e0;
    --gut-on-ink: #0a1222;
    --neutral: #7c8a83;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1311;
  --surface: #161c19;
  --surface-2: #1f2723;
  --ink: #e5ebe8;
  --ink-2: #b0bbb6;
  --muted: #8a9791;
  --line: #29312d;
  --line-2: #3d4743;
  --accent: #6b9ef0;
  --accent-ink: #0a1222;
  --accent-wash: #1a2741;
  --gut: #4f78c0;
  --gut-on: #7da2e0;
  --gut-on-ink: #0a1222;
  --neutral: #7c8a83;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-text-size-adjust: 100%;
}
body.no-scroll { overflow: hidden; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
p { margin: 0; }

.app {
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 머리 */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top-text { min-width: 0; }
.top h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.top-text p { margin-top: 2px; color: var(--ink-2); font-size: 13px; text-wrap: balance; }
.date-chip { flex: none; font-size: 12px; font-weight: 500; color: var(--ink-2); padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-variant-numeric: tabular-nums; }
.banner { padding: 10px 14px; border-radius: 12px; background: var(--accent-wash); color: var(--ink); font-size: 13px; }
.banner-warn { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; background: var(--surface-2); background: color-mix(in srgb, var(--warn) 22%, var(--surface)); }

/* 카드 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 16px; }
.h2 { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.h3 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.sec-sub { font-size: 12px; color: var(--muted); }

/* 오늘 판정 */
.today-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.today-head > div { min-width: 0; }
.reading { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; margin-top: 4px; }
.reading-num { font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; }
.reading-of { font-size: 16px; color: var(--muted); align-self: flex-end; margin: 0 0 6px -8px; }
.reading-cap { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.lv { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 6px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--surface-2); background: color-mix(in srgb, var(--tone) 17%, var(--surface)); }
.lv svg { width: 18px; height: 18px; color: var(--tone); flex: none; }
.tone-full { --tone: var(--good); }
.tone-ok { --tone: var(--neutral); }
.tone-low { --tone: var(--warn); }
.tone-empty { --tone: var(--crit); }

.gap { margin-top: 10px; font-size: 15px; }
.gap.is-over { padding: 10px 12px; border-radius: var(--r-s); background: var(--surface-2); background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
.notes { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.notes li { padding-left: 14px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }

.rhythm-line { margin-top: 8px; font-size: 14px; color: var(--ink-2); }
.rhythm-line b { color: var(--ink); font-variant-numeric: tabular-nums; }
.rhythm-line.is-warn { padding: 9px 12px; border-radius: var(--r-s); color: var(--ink); background: var(--surface-2); background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
.rhythm-count { margin-top: 12px; }
.down { margin-left: 2px; color: var(--crit); font-weight: 700; }
.plan { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.plan-k { font-size: 12px; color: var(--muted); }
.plan-v { margin: 2px 0 8px; font-size: 19px; font-weight: 700; }
.pills { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.pills li { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.plan-note { margin: 0 0 10px; font-size: 14px; color: var(--ink); }
.plan-note.is-over { padding: 9px 12px; border-radius: 10px; background: var(--surface-2); background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
.plan-foot { margin-top: 8px; font-size: 12px; color: var(--muted); }

.brake { margin-top: 14px; padding: 12px 14px; border-radius: var(--r-s); background: var(--surface-2); background: color-mix(in srgb, var(--crit) 9%, var(--surface)); border: 1px solid var(--line-2); border-color: color-mix(in srgb, var(--crit) 38%, var(--surface)); }
.brake-h { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.brake-h svg { width: 18px; height: 18px; color: var(--crit); flex: none; }
.brake-why { margin: 2px 0 10px 26px; font-size: 13px; color: var(--ink-2); }
.brake-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.brake-steps li { display: grid; grid-template-columns: 40px 1fr; gap: 8px; font-size: 14px; }
.brake-steps b { font-weight: 600; }
.recover { margin-top: 14px; }
.recover-k { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

details.more { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 4px; }
details summary { cursor: pointer; font-size: 14px; color: var(--ink-2); padding: 10px 0; }
.parts { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
.parts li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.parts li:last-child { border-bottom: 0; }
.parts .d { flex: none; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* 눈금: 0~10, 아래 띠는 상태 구간. 값은 위의 범례 줄에 적는다 */
.scale-key { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 14px; font-size: 13px; color: var(--ink); }
.scale-key span { display: inline-flex; align-items: center; gap: 6px; }
.scale-key.is-ghost { color: var(--ink-2); }
.key-gut { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--gut); flex: none; }
.key-sig { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
.scale { position: relative; height: 62px; margin: 8px 6px 0; }
.scale-zones { position: absolute; left: 0; right: 0; top: 10px; height: 8px; }
.scale-zones .z { position: absolute; top: 0; height: 100%; background: var(--tone); background: color-mix(in srgb, var(--tone) 72%, var(--surface)); }
.scale-zones .z:first-child { border-radius: 4px 0 0 4px; }
.scale-zones .z:last-child { border-radius: 0 4px 4px 0; }
.scale-ticks { position: absolute; left: 0; right: 0; top: 24px; height: 5px; }
.scale-ticks i { position: absolute; top: 0; width: 1px; height: 5px; background: var(--line-2); }
.scale-link { position: absolute; top: 13px; height: 2px; background: var(--gut); }
.mk { position: absolute; top: 14px; width: 0; height: 0; }
.mk::before { content: ""; position: absolute; border-radius: 50%; }
.mk-gut::before { width: 24px; height: 24px; left: -12px; top: -12px; border: 3px solid var(--gut); box-shadow: 0 0 0 2px var(--surface), inset 0 0 0 2px var(--surface); }
.mk-sig::before { width: 16px; height: 16px; left: -8px; top: -8px; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.scale-nums { position: absolute; left: 0; right: 0; top: 32px; font: 500 11px/1 var(--font-data); color: var(--muted); }
.scale-names { position: absolute; left: 0; right: 0; top: 47px; font-size: 11px; line-height: 1; color: var(--muted); }
.scale-nums span, .scale-names span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.scale-nums span:first-child { transform: none; }
.scale-nums span:last-child { transform: translateX(-100%); }
.scale.is-ghost .mk, .scale.is-ghost .scale-link { opacity: 0.5; }

.example { margin-top: 12px; padding: 12px 12px 10px; border-radius: var(--r-s); background: var(--surface-2); }
.example .scale-key { margin-top: 10px; }
.example-tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }
.example-text { margin-top: 8px; font-size: 13px; color: var(--ink-2); }

/* 버튼 */
.btn { min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:disabled { background: var(--surface-2); border-color: var(--line-2); color: var(--muted); cursor: not-allowed; }
.btn-ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn-small { min-height: 40px; padding: 6px 12px; font-size: 14px; flex: none; }
.btn-block { width: 100%; margin-top: 14px; }
.btn-sub { font-weight: 500; font-size: 13px; opacity: 0.85; }
.link { background: none; border: 0; padding: 10px 2px; min-height: 40px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 16px; height: 16px; }

/* 고르기 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); text-align: left; cursor: pointer; font-size: 14px; line-height: 1.35; }
.chip-box { flex: none; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-2); display: grid; place-items: center; background: var(--surface); }
.chip-box svg { width: 12px; height: 12px; opacity: 0; color: var(--accent-ink); }
.chip.is-on { background: var(--accent-wash); border-color: var(--accent); }
.chip.is-on .chip-box { background: var(--accent); border-color: var(--accent); }
.chip.is-on .chip-box svg { opacity: 1; }
.chip-tag { font-size: 11px; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; flex: none; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-4 { display: grid; grid-template-columns: repeat(4, 1fr); }
.seg-col { display: grid; }
.seg-col .opt { text-align: left; }
.opt { min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 14px; }
.opt.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.q { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 8px; }
.q legend { padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
.q + .q { margin-top: 20px; }
.hint { font-size: 12px; color: var(--muted); }
.hint-strong { margin-bottom: 16px; padding: 9px 12px; border-radius: 10px; background: var(--accent-wash); color: var(--ink); font-size: 13px; }

/* 지난 결과 묻기 */
.ask { background: var(--surface-2); border-radius: var(--r); padding: 14px 16px 6px; }
.ask-q { font-weight: 600; }
.ask-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }
.ask-opts { margin-top: 10px; }
.ask-opts, .oc-pick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.oc-btn { min-height: 44px; padding: 6px 10px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.oc-btn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tone); flex: none; }
.oc-btn.is-on { border-color: var(--ink); font-weight: 600; }

/* 지금 멈춤 점검 */
.quick .chips { margin-top: 12px; }
.verdict { margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-s); background: var(--surface-2); background: color-mix(in srgb, var(--tone) 14%, var(--surface)); font-size: 14px; }
.verdict svg { width: 18px; height: 18px; color: var(--tone); flex: none; margin-top: 2px; }
.verdict b { font-weight: 700; }

/* 기록 */
.log { display: flex; flex-direction: column; gap: 10px; }
.legend { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.stats { margin: 0; border-top: 1px solid var(--line); }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.stat dt { font-size: 13px; color: var(--ink-2); }
.stat dd { margin: 0; font-weight: 600; text-align: right; }
.stat .sub { grid-column: 1 / -1; margin: 0; font-size: 12px; font-weight: 400; color: var(--muted); text-align: left; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { padding: 12px 0 10px; border-bottom: 1px solid var(--line); }
.row-top { display: flex; align-items: center; gap: 10px; }
.row-date { font-size: 13px; font-weight: 500; color: var(--ink-2); min-width: 70px; font-variant-numeric: tabular-nums; }
.row-vals { flex: 1; min-width: 0; font-size: 14px; }
.row-vals b { font-weight: 600; font-variant-numeric: tabular-nums; }
.row-more { font-size: 12px; color: var(--muted); }
.oc { flex: none; min-height: 40px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.oc::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); flex: none; }
.oc.oc-empty { color: var(--ink-2); }
.oc.oc-empty::before { background: transparent; border: 1.5px solid var(--line-2); width: 9px; height: 9px; }
.oc-pick { margin-top: 10px; }
.mini { position: relative; height: 18px; margin: 8px 6px 0; }
.mini-track { position: absolute; left: 0; right: 0; top: 8px; height: 2px; border-radius: 1px; background: var(--line); }
.mini-tick { position: absolute; top: 5px; width: 1px; height: 8px; background: var(--line-2); }
.mini-link { position: absolute; top: 8px; height: 2px; background: var(--gut); }
.mini-gut { position: absolute; top: 9px; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid var(--gut); background: var(--surface); }
.mini-sig { position: absolute; top: 9px; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.empty-log { padding: 14px 0; font-size: 14px; color: var(--ink-2); border-top: 1px solid var(--line); }

/* 계산 방법 */
.how-body { display: grid; gap: 10px; padding-bottom: 6px; font-size: 14px; }
.table-wrap { overflow-x: auto; }
.how table { width: 100%; border-collapse: collapse; font-size: 13px; }
.how th, .how td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.how .d { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-right: 0; }
.how tbody th { padding-top: 14px; color: var(--ink-2); font-weight: 600; }
.how-rules { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink-2); font-size: 13px; }

.foot { display: grid; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.foot a { color: var(--ink-2); }

/* 체크 시트 */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; justify-content: center; }
.sheet-panel { width: 100%; max-width: 34rem; height: 100%; display: flex; flex-direction: column; }
.sheet-head { padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-step { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.progress { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px; }
.progress span { height: 4px; border-radius: 2px; background: var(--line); }
.progress span.on { background: var(--accent); }
.sheet-body { flex: 1; overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-title { margin: 0; font-size: 21px; line-height: 1.35; font-weight: 700; text-wrap: balance; }
.sheet-title:focus { outline: none; }
.sheet-sub { margin: 6px 0 18px; font-size: 14px; color: var(--ink-2); }
.sheet-foot { display: flex; justify-content: space-between; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
.sheet-foot .btn { flex: 1; }

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

const floorHalf = (x) => Math.floor(x * 2 + 1e-9) / 2;

const num = (x) => String(Math.round(x * 100) / 100);

/* ── 날짜: 하루는 새벽 6시에 바뀐다 ── */
const pad = (n) => String(n).padStart(2, "0");

const keyOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

/* ── 점수 계산 ── */
function levelOf(s) {
  if (s >= 8) return "full";
  if (s >= 6) return "ok";

}
function computeResult(c) {
  const parts = [];
  const sh = SLEEP_H.find((o) => o.id === c.sleepH);
  if (sh && sh.d) parts.push({ label: "잠 " + sh.label, d: sh.d });
  const wk = WAKE.find((o) => o.id === c.wake);
  if (wk && wk.d) parts.push({ label: "일어났을 때 " + wk.label, d: wk.d });
  const mv = MOVE.find((o) => o.id === c.move);

  if (us && us.d) parts.push({ label: "오늘 이미 쓴 에너지: " + us.label, d: us.d });
  const rh = rhythmOfCheck(c);
  if (rh) {
    const rd = rhythmD(rh.kept, rh.total);
    if (rd) parts.push({ label: "생활 리듬 " + rh.kept + "/" + rh.total + " 지킴", d: rd });
  }

  for (const g of FLAG_GROUPS) for (const o of g) if (o.d && flags.includes(o.id)) parts.push({ label: o.label, d: o.d });
  const computed = floorHalf(clamp(10 + parts.reduce((s, p) => s + p.d, 0), 0, 10));
  const score = Number.isFinite(c.score) ? half(clamp(c.score, 0, 10)) : computed;
  const gut = clamp(Number(c.gut) || 0, 0, 10);
  const gap = gut - score;
  const brakeHits = BRAKE.filter((o) => flags.includes(o.id));
  const inflateHits = INFLATE.filter((o) => flags.includes(o.id));
  return {
    score, gut, gap, parts,
    level: levelOf(score),
    planLevel: levelOf(Math.min(score, gut)),
    planByGut: gut < score,
    brakeHits,
    brakeOn: brakeHits.length > 0 || score <= 3.5,
    inflateHits,
    overRisk: gap >= 2 || (gap >= 1 && inflateHits.length >= 1),
    masked: flags.includes("caffeine") || flags.includes("grit"),
    elated: flags.includes("idea") || flags.includes("cando"),
  };
}
function gapText(r) {

  if (g >= 1) return "느낌(" + fmt(r.gut) + ")이 신호보다 " + fmt(g) + "점 높아요. 계획은 신호 쪽에 맞췄어요.";

function normalizeDay(v, id) {

/* ── 저장소 (claude.ai 앱 안의 db) ── */

const enqueue = (fn) => { const p = chain.then(fn); chain = p.catch(() => {}); return p; };
let markReady = () => {};
const ready = new Promise((r) => { markReady = r; });

async function connect() {
  try {
    const c = window.claude;
    if (!c || typeof c.use !== "function") { goLocal(); return; }
    let d = null, u = null;
    try { [d, u] = await Promise.all([c.use("db"), c.use("user")]); } catch (e) { d = null; }
    if (!d) { goLocal(); return; }
    db = d;
    state.mode = "db";
    if (u) { try { state.owner = await u.isOwner(); } catch (e) { state.owner = null; } }
    subscribe();
    render();
  } finally {
    markReady();
  }
}
function goLocal() { state.mode = "local"; state.loaded = true; render(); }

/* 아직 저장이 끝나지 않은 변경을 화면용 기록 위에 다시 얹는다 */
function withPending(m) {
  const live = state.pending.filter((p) => p.status !== "inflight");
  if (!live.length) return m;
  const out = new Map(m);
  for (const p of live) {
    const cur = out.get(p.k);
    out.set(p.k, normalizeDay(p.mutate(cur ? clone(cur) : null), p.k));
  }
  return out;
}

function subscribe() {
  let confirmed = false;
  const timer = setTimeout(() => {
    if (!confirmed) { state.loadNote = "기록을 아직 불러오지 못했어요. 연결되면 자동으로 보여요."; state.loaded = true; render(); }
  }, 10000);
  try {
    db.collection("days").orderBy("date", "desc").limit(120).onSnapshot((snap) => {
      const m = new Map();
      for (const doc of snap.docs) {
        if (!doc.exists || !isDayKey(doc.id)) continue;
        const v = doc.data();
        if (!v || v.date !== doc.id) continue;
        m.set(doc.id, normalizeDay(v, doc.id));
      }
      state.days = withPending(m);
      state.loaded = true;
      if (!snap.metadata.fromCache) { confirmed = true; clearTimeout(timer); state.loadNote = ""; }
      render();
    }, (err) => {
      confirmed = true;
      clearTimeout(timer);
      state.loaded = true;
      state.loadNote = "기록을 불러오지 못했어요 (" + esc((err && err.code) || "알 수 없음") + "). 잠시 뒤 다시 열어 보세요.";
      render();
    });
  } catch (e) {
    clearTimeout(timer);
    state.loaded = true;
    state.loadNote = "기록을 불러오지 못했어요.";
    render();
  }
}

async function withRetry(fn) {
  try {
    return await fn();
  } catch (e) {
    if (e && e.code === "unavailable") {
      await new Promise((r) => setTimeout(r, 400 + Math.random() * 800));
      return await fn();
    }
    throw e;
  }
}
/* 저장: 화면에는 바로 보여 주고, 저장할 때는 저장된 문서를 새로 읽어 그 위에 고친다.
   화면의 기록이 오래됐거나 아직 안 불러와졌어도 다른 체크·결과를 덮어쓰지 않는다. */
function saveDay(k, mutate) {
  const cur = state.days.get(k);
  const next = new Map(state.days);
  next.set(k, normalizeDay(mutate(cur ? clone(cur) : null), k));
  state.days = next;
  if (blockedSave()) {
    render();
    toast(state.mode === "db" ? "앱 주인만 저장할 수 있어서 저장하지 않았어요" : "미리보기라서 저장되지 않았어요");
    return Promise.resolve();
  }
  const p = { k, mutate, status: "queued" };
  state.pending.push(p);
  render();
  return runPending(p);
}
function runPending(p) {
  p.status = "queued";
  render();
  return enqueue(async () => {
    await ready;
    if (blockedSave()) {
      dropPending(p);
      toast("미리보기라서 저장되지 않았어요");
      return;
    }
    try {
      const ref = db.collection("days").doc(p.k);
      const snap = await withRetry(() => ref.get());
      const raw = snap && snap.exists ? clone(snap.data()) : null;
      const body = p.mutate(raw);
      p.status = "inflight";
      await withRetry(() => ref.set(body));
      dropPending(p);
      toast("저장했어요");
    } catch (e) {
      p.status = "failed";
      const code = e && e.code;
      render();
      toast(code === "invalid_argument" ? "이 기록은 앱 주인만 저장할 수 있어요"
        : code === "quota_exceeded" ? "저장 공간이 꽉 찼어요. 오래된 기록을 정리해야 해요"
        : "저장하지 못했어요. 위의 '다시 저장'을 눌러 주세요");
    }
  });
}
function dropPending(p) {
  state.pending = state.pending.filter((x) => x !== p);
  render();
}
function retryFailed() {
  for (const p of state.pending.filter((x) => x.status === "failed")) runPending(p);
}

/* ── 체크 흐름 ── */
function pushedFromLog(tk) {
  let known = 0, n = 0;
  for (let i = 1; i <= 3; i++) {
    const d = state.days.get(addDays(tk, -i));
    if (d && d.outcome) { known++; if (d.outcome === "pushed" || d.outcome === "crashed") n++; }
  }
  return known ? n : null;
}
function needsUsedNow(k) {
  const h = new Date().getHours();
  const day = state.days.get(k);
  return h >= 12 || h < 6 || !!(day && day.checks.length);
}
function newDraft(k) {
  const today = state.days.get(k);
  const prev = today && today.checks.length ? today.checks[today.checks.length - 1] : null;
  const fromLog = pushedFromLog(k);
  return {
    k,
    step: 0,
    gut: null,
    sleepH: prev ? prev.sleepH : null,
    wake: prev ? prev.wake : null,
    move: prev ? prev.move : null,
    pushed: prev && prev.pushed !== null ? prev.pushed : fromLog,
    pushedFromLog: !prev && fromLog !== null,
    planned: prev ? prev.planned : null,
    rhythm: prev && Array.isArray(prev.rhythm) ? prev.rhythm.filter((id) => RHYTHM.some((o) => o.id === id)) : [],
    used: null,
    showUsed: needsUsedNow(k),
    dayChanged: false,
    flags: prev ? prev.flags.filter((f) => DAY_FLAGS.includes(f)) : [],
  };
}
function canNext(d) {
  if (d.step === 0) return d.gut !== null;
  if (d.step === 1) return !!d.sleepH && !!d.wake && !!d.move;
  if (d.step === 3) return d.pushed !== null && d.planned !== null && d.planned !== undefined && (!d.showUsed || !!d.used);
  return true;
}
function openCheck() {
  const k = todayKey();
  if (!state.draft || state.draft.k !== k) state.draft = newDraft(k);
  const d = state.draft;
  if (!d.showUsed && needsUsedNow(k)) {
    d.showUsed = true;
    if (d.step > 3 && !d.used) d.step = 3;
  }
  state.sheetOpen = true;
  renderSheet({ opening: true });
}
function closeSheet() {
  state.sheetOpen = false;
  renderSheet();
  render();
  focusFirst(["btn-start", "btn-recheck"]);
}
function finishCheck() {
  const d = state.draft;
  if (!d || d.gut === null) return;
  const now = new Date();
  const k = dayKey(now);
  if (d.k !== k) {
    /* 체크하는 사이 새벽 6시가 지나 날짜가 바뀜: 오늘 기준으로 잠과 부하를 다시 확인받는다 */
    const fresh = newDraft(k);
    fresh.gut = d.gut;
    for (const f of d.flags) if (!DAY_FLAGS.includes(f) && !fresh.flags.includes(f)) fresh.flags.push(f);
    fresh.step = 1;
    fresh.dayChanged = true;
    state.draft = fresh;
    renderSheet({ stepChanged: true });
    return;
  }
  const c = {
    at: now.toISOString(),
    gut: d.gut,
    sleepH: d.sleepH,
    wake: d.wake,
    move: d.move,
    pushed: d.pushed,
    planned: d.planned,
    rhythm: d.rhythm.slice(),
    rhythmOf: RHYTHM.length,
    used: d.showUsed ? d.used : null,
    flags: d.flags.slice(),
    v: MODEL_V,
  };
  const r = computeResult(c);
  c.score = r.score;
  c.level = r.level;
  state.draft = null;
  state.sheetOpen = false;
  renderSheet();
  saveDay(k, (raw) => {
    const base = raw || {};
    const checks = Array.isArray(base.checks) ? base.checks.slice() : [];
    checks.push(c);
    return Object.assign({}, base, {
      date: k,
      checks,
      outcome: base.outcome !== undefined ? base.outcome : null,
      outcomeAt: base.outcomeAt !== undefined ? base.outcomeAt : null,
      updatedAt: c.at,
    });
  });
  window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
  focusFirst(["btn-recheck"]);
}
function setOutcome(k, id) {
  if (!isDayKey(k) || !OUTCOMES.some((o) => o.id === id)) return;
  const at = new Date().toISOString();
  state.ocEdit = null;
  saveDay(k, (raw) => {
    const base = raw || {};
    return Object.assign({}, base, { date: k, checks: Array.isArray(base.checks) ? base.checks : [], outcome: id, outcomeAt: at, updatedAt: at });
  });
}

/* ── 그리기 ── */
function levelChip(lv) {
  return '<span class="lv tone-' + lv + '">' + ICON[lv] + "<span>" + LEVELS[lv].name + "</span></span>";
}
function scaleHTML(gut, score, ghost) {
  const g = pct(gut), s = pct(score);
  const lo = Math.min(g, s), hi = Math.max(g, s);
  const zones = [["empty", 0, 40], ["low", 40, 60], ["ok", 60, 80], ["full", 80, 100]].map(([t, a, b]) =>
    '<span class="z tone-' + t + '" style="left:calc(' + a + "% + " + (a ? 1 : 0) + "px);width:calc(" + (b - a) + "% - " + ((a ? 1 : 0) + (b < 100 ? 1 : 0)) + 'px)"></span>').join("");
  let ticks = "";
  for (let n = 0; n <= 10; n++) ticks += '<i style="left:calc(' + n * 10 + '% - 0.5px)"></i>';
  const nums = [0, 2, 4, 6, 8, 10].map((n) => '<span style="left:' + n * 10 + '%">' + n + "</span>").join("");
  const names = [["바닥", 20], ["낮음", 50], ["보통", 70], ["충분", 90]].map(([n, x]) => '<span style="left:' + x + '%">' + n + "</span>").join("");
  const aria = ghost ? "예시 눈금: 느낌 8, 신호 5" : "0부터 10까지 눈금에서 느낌 " + fmt(gut) + ", 신호 " + fmt(score);
  return '<div class="scale-key' + (ghost ? " is-ghost" : "") + '" aria-hidden="true">' +
      '<span><i class="key-gut"></i>느낌 ' + fmt(gut) + "</span>" +
      '<span><i class="key-sig"></i>신호 ' + fmt(score) + "</span></div>" +
    '<div class="scale' + (ghost ? " is-ghost" : "") + '" role="img" aria-label="' + aria + '">' +
    '<div class="scale-zones">' + zones + "</div>" +
    '<div class="scale-ticks">' + ticks + "</div>" +
    '<div class="scale-link" style="left:' + lo + "%;width:" + (hi - lo) + '%"></div>' +
    '<div class="mk mk-gut" style="left:' + g + '%"></div>' +
    '<div class="mk mk-sig" style="left:' + s + '%"></div>' +
    '<div class="scale-nums" aria-hidden="true">' + nums + "</div>" +
    '<div class="scale-names" aria-hidden="true">' + names + "</div>" +
    "</div>";
}
function chipHTML(o, on, act, id, tag) {
  return '<button type="button" class="chip' + (on ? " is-on" : "") + '" data-act="' + act + '" data-v="' + esc(o.id) + '" id="' + id + '" aria-pressed="' + on + '">' +
    '<span class="chip-box">' + ICON.check + "</span>" + (tag ? '<span class="chip-tag">' + esc(tag) + "</span>" : "") + "<span>" + esc(o.label) + "</span></button>";
}
function optHTML(act, v, label, on, id) {
  return '<button type="button" class="opt' + (on ? " is-on" : "") + '" data-act="' + act + '" data-v="' + esc(v) + '" id="' + id + '" aria-pressed="' + on + '">' + esc(label) + "</button>";
}

function renderBanner() {
  const el = $("#banner");
  let html = "";
  const failed = state.pending.filter((p) => p.status === "failed").length;
  if (failed) html += '<div class="banner banner-warn"><span>저장하지 못한 기록이 ' + failed + '개 있어요.</span><button type="button" class="btn btn-ghost btn-small" data-act="retry-save" id="btn-retry">다시 저장</button></div>';
  if (state.mode === "local") html += '<p class="banner">미리보기 모드예요. 여기서 한 체크는 저장되지 않아요. claude.ai에서 열면 기록이 저장돼요.</p>';
  else if (state.mode === "db" && state.owner === false) html += '<p class="banner">이 기록은 앱 주인만 볼 수 있어요. 여기서 한 체크는 저장되지 않아요.</p>';
  el.hidden = !html;
  el.innerHTML = html;
}

/* 결과를 안 남긴 날 묻기: 최근 2~3일 중 체크는 했는데 결과가 빈 날(오래된 날부터), 그다음 어제 */
function askDay() {
  if (!state.loaded || !state.days.size) return null;
  const tk = todayKey();
  for (let i = 3; i >= 2; i--) {
    const k = addDays(tk, -i);
    const d = state.days.get(k);
    if (d && d.checks.length && !d.outcome && !state.dismissed.has(k)) return k;
  }
  const y = addDays(tk, -1);
  const d = state.days.get(y);
  if (!(d && d.outcome) && !state.dismissed.has(y)) return y;
  return null;
}
function renderAsk() {
  const el = $("#ask");
  const k = askDay();
  if (!k) { el.hidden = true; el.innerHTML = ""; return; }
  const isY = k === addDays(todayKey(), -1);
  const dt = keyToDate(k);
  const q = isY ? "어제(" + (dt.getMonth() + 1) + "." + dt.getDate() + " " + WD[dt.getDay()] + ")는 어땠어요?" : dayLabel(k) + "은 어땠어요?";
  el.hidden = false;
  el.innerHTML = '<div class="ask"><p class="ask-q" id="ask-h">' + q + "</p>" +
    (isY ? "" : '<p class="ask-sub">체크한 날인데 결과가 비어 있어요.</p>') +
    '<div class="ask-opts" role="group" aria-labelledby="ask-h">' +
    OUTCOMES.map((o) => '<button type="button" class="oc-btn tone-' + o.tone + '" data-act="set-oc" data-k="' + k + '" data-oc="' + o.id + '" id="ask-' + o.id + '">' + o.label + "</button>").join("") +
    '</div><button type="button" class="link" data-act="dismiss-ask" data-k="' + k + '" id="ask-skip">나중에</button></div>';
}

function renderToday() {
  const el = $("#today");
  const k = todayKey();
  const day = state.days.get(k);
  const last = day && day.checks.length ? day.checks[day.checks.length - 1] : null;
  if (!last) {
    const resume = state.draft && state.draft.k === k;
    el.innerHTML =
      '<p class="eyebrow">오늘 ' + dayLabel(k) + "</p>" +
      '<h2 id="today-h" class="h2" tabindex="-1">' + (state.loaded ? "아직 체크 전이에요" : "기록을 불러오는 중…") + "</h2>" +
      '<div class="example"><span class="example-tag">예시</span>' + scaleHTML(8, 5, true) +
      '<p class="example-text">느낌은 8인데 몸과 마음의 신호로 재면 5. 이 3점 차이가 무리하게 만드는 틈이에요.</p></div>' +
      '<button type="button" class="btn btn-primary btn-block" data-act="open-check" id="btn-start">' +
      (resume ? "하던 체크 이어서 하기" : '오늘 체크 시작 <span class="btn-sub">1분</span>') + "</button>";
    return;
  }
  const r = computeResult(last);
  const n = day.checks.length;
  const notes = [];
  if (r.masked) notes.push("커피나 끈기로 버티는 중이면 느낌이 실제보다 높게 나와요.");
  if (r.elated) notes.push("들뜬 날은 느낌이 높게 나와요. 큰 결심은 하루 묵혀 두기.");
  const plan = LEVELS[r.planLevel];
  const showRecovery = r.brakeOn || r.planLevel === "low" || r.planLevel === "empty";
  el.innerHTML =
    '<div class="today-head"><div>' +
      '<p class="eyebrow">오늘 ' + dayLabel(k) + " · " + timeLabel(last.at) + " 체크" + (n > 1 ? " · " + n + "번째" : "") + "</p>" +
      '<h2 id="today-h" class="visually-hidden" tabindex="-1">오늘 판정</h2>' +
      '<div class="reading"><span class="reading-num">' + fmt(r.score) + '</span><span class="reading-of">/10</span>' + levelChip(r.level) + "</div>" +
      '<p class="reading-cap">몸과 마음의 신호로 잰 에너지</p>' +
    "</div>" +
    '<button type="button" class="btn btn-ghost btn-small" data-act="open-check" id="btn-recheck">다시 체크</button></div>' +
    scaleHTML(r.gut, r.score, false) +
    '<p class="gap' + (r.overRisk ? " is-over" : "") + '">' + esc(gapText(r)) + "</p>" +
    (notes.length ? '<ul class="notes">' + notes.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>" : "") +
    rhythmLineHTML(k, last) +
    '<div class="plan"><p class="plan-k">오늘 계획 크기' + (r.planByGut ? " (느낌 기준)" : "") + "</p>" +
      '<p class="plan-v">' + esc(plan.plan) + "</p>" +
      plannedHTML(r.planLevel, last.planned) +
      '<ul class="pills">' + plan.tips.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>" +
      '<p class="plan-foot">큰 일: 집중이 필요한 일, 외출, 사람 만나기</p></div>' +
    (r.brakeOn ? '<div class="brake" role="note"><p class="brake-h">' + ICON.empty + "브레이크 밟을 때예요</p>" +
      '<p class="brake-why">' + (r.brakeHits.length ? "켜진 기준: " + r.brakeHits.map((h) => h.short).join(" · ") : "신호 점수가 3.5 이하예요") + "</p>" +
      '<ol class="brake-steps"><li><b>멈춤</b><span>꼭 할 일 하나만 남기고 나머지는 내려놓기</span></li>' +
      "<li><b>회복</b><span>원인 분석은 미루고 쉬기</span></li>" +
      "<li><b>복귀</b><span>흥미가 다시 생기면 하나씩 돌아오기</span></li></ol></div>" : "") +
    (showRecovery ? '<div class="recover"><p class="recover-k">회복 메뉴</p><ul class="pills">' + RECOVERY.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul></div>" : "") +
    '<details class="more" id="today-details"><summary>점수 계산 내역</summary>' +
      (r.parts.length ? '<ul class="parts">' + r.parts.map((p) => "<li><span>" + esc(p.label) + '</span><span class="d">' + minus(p.d) + "</span></li>").join("") + "</ul>"
        : '<p class="note">더하거나 깎인 곳 없이 10점이에요.</p>') +
    "</details>";
}
/* 생활 리듬: 그날 마지막 체크 기준. 흐름은 최근 5일 안의 기록 3개가 이틀 연속 줄었는지 (pts[0]이 가장 최근) */
function dayRhythm(k) {
  const day = state.days.get(k);
  return day ? rhythmOfCheck([...day.checks].reverse().find((x) => Array.isArray(x.rhythm))) : null;
}
function rhythmTrend(k) {
  const pts = [];
  for (let i = 0; i < 5 && pts.length < 3; i++) {
    const rh = dayRhythm(addDays(k, -i));
    if (rh) pts.push(rh);
  }
  const r = pts.map((p) => p.kept / p.total);
  return { pts, falling: pts.length === 3 && r[0] < r[1] && r[1] < r[2] };
}
function rhythmLineHTML(k, last) {
  const rh = rhythmOfCheck(last);
  if (!rh) return "";
  const tr = rhythmTrend(k);
  if (tr.falling) {
    return '<p class="rhythm-line is-warn">생활 리듬 <b>' + rh.kept + "/" + rh.total + "</b> · 이틀째 줄고 있어요 (" +
      tr.pts.slice().reverse().map((p) => p.kept).join(" → ") + "). 흔들리기 시작한 신호예요. 오늘은 큰 일보다 기상·끼니·잠부터 지키기</p>";
  }
  return '<p class="rhythm-line">생활 리듬 <b>' + rh.kept + "/" + rh.total + "</b></p>";
}
function rhythmText(rh, older) {
  if (!rh) return "";
  const down = older && rh.kept / rh.total < older.kept / older.total;
  return " · 리듬 <b>" + rh.kept + "/" + rh.total + "</b>" +
    (down ? '<span class="down" aria-hidden="true">↓</span><span class="visually-hidden">(전보다 줄어듦)</span>' : "");
}
/* 오늘 이미 잡힌 큰 일을 계획 크기와 견준다 */
function plannedHTML(level, planned) {
  if (!Number.isInteger(planned) || planned <= 0) return "";
  const cap = LEVELS[level].cap;
  const p = planned >= 3 ? "3개 이상" : planned + "개";
  const ro = planned >= 3 ? "으로" : "로";
  let text;
  let over = false;
  if (planned < cap) text = "이미 잡힌 큰 일 " + p + " · 더 넣는다면 " + (cap - planned) + "개까지";
  else if (planned === cap) text = "이미 잡힌 큰 일 " + p + ro + " 꽉 찼어요. 새로 넣지 않기";
  else {

function insights() {
  const tk = todayKey();
  const all = [...state.days.values()];
  const rows = all.filter((d) => d.checks.length).map((d) => ({ c: d.checks[0], o: d.outcome }));
  const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length;
  const res = { n: rows.length, avgGap: null, bad: null, good: null };
  if (rows.length >= 3) res.avgGap = avg(rows.map((r) => r.c.gut - r.c.score));
  const bad = rows.filter((r) => r.o === "pushed" || r.o === "crashed");
  const good = rows.filter((r) => r.o === "easy" || r.o === "fit");
  if (bad.length >= 2) res.bad = { n: bad.length, gut: avg(bad.map((r) => r.c.gut)), score: avg(bad.map((r) => r.c.score)) };
  if (good.length >= 2) res.good = { n: good.length, gut: avg(good.map((r) => r.c.gut)), score: avg(good.map((r) => r.c.score)) };
  const from = addDays(tk, -29);
  const recent = all.filter((d) => d.date >= from && d.date <= tk);
  res.crashed30 = recent.filter((d) => d.outcome === "crashed").length;
  res.pushed30 = recent.filter((d) => d.outcome === "pushed").length;
  return res;
}

  body.scrollTop = opts.stepChanged || fresh ? 0 : top;

  if (fresh || opts.stepChanged) {
    const h = $("#sheet-h");
    if (h) h.focus({ preventScroll: true });
  } else if (fid) {
    const f = document.getElementById(fid);
    if (f) f.focus({ preventScroll: true });
  }
}

/* ── 알림 ── */
let toastTimer = 0;
let toastTextTimer = 0;
function toast(msg) {
  const el = $("#toast");
  if (!msg) return;
  el.hidden = false;
  el.textContent = "";
  clearTimeout(toastTimer);
  clearTimeout(toastTextTimer);
  toastTextTimer = setTimeout(() => { el.textContent = msg; }, 40);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2800);
}
function announce(text) {
  const el = $("#sr-live");
  el.textContent = "";
  setTimeout(() => { el.textContent = text; }, 40);
}

/* ── 누르기 ── */
function toggleIn(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const d = state.draft;
  switch (act) {
    case "open-check": openCheck(); break;
    case "close-check": closeSheet(); break;
    case "set-gut": if (d) { d.gut = Number(b.dataset.v); renderSheet(); } break;
    case "set-sleep": if (d) { d.sleepH = b.dataset.v; renderSheet(); } break;
    case "set-wake": if (d) { d.wake = b.dataset.v; renderSheet(); } break;
    case "set-move": if (d) { d.move = b.dataset.v; renderSheet(); } break;
    case "set-pushed": if (d) { d.pushed = Number(b.dataset.v); d.pushedFromLog = false; renderSheet(); } break;
    case "set-planned": if (d) { d.planned = Number(b.dataset.v); renderSheet(); } break;
    case "set-used": if (d) { d.used = b.dataset.v; renderSheet(); } break;
    case "flag": if (d && ALL_FLAGS.has(b.dataset.v)) { toggleIn(d.flags, b.dataset.v); renderSheet(); } break;
    case "rhythm": if (d && RHYTHM.some((o) => o.id === b.dataset.v)) { toggleIn(d.rhythm, b.dataset.v); renderSheet(); } break;
    case "step-next": if (d && canNext(d) && d.step < LAST_STEP) { d.step++; renderSheet({ stepChanged: true }); } break;
    case "step-back": if (d && d.step > 0) { d.step--; renderSheet({ stepChanged: true }); } break;
    case "finish": finishCheck(); break;
    case "set-oc": {
      const fromAsk = !!b.closest("#ask");
      setOutcome(b.dataset.k, b.dataset.oc);
      if (fromAsk) focusFirst(["ask-easy", "btn-start", "today-h"]);
      else focusFirst(["oc-" + b.dataset.k]);
      break;
    }
    case "oc-edit": state.ocEdit = state.ocEdit === b.dataset.k ? null : b.dataset.k; render(); break;
    case "dismiss-ask": state.dismissed.add(b.dataset.k); render(); focusFirst(["ask-easy", "btn-start", "today-h"]); break;
    case "q-toggle": {
      if (state.quick.has(b.dataset.v)) state.quick.delete(b.dataset.v); else state.quick.add(b.dataset.v);
      render();
      const v = quickVerdict();
      announce(v.title + " " + v.text);
      break;
    }
    case "q-clear": state.quick.clear(); render(); focusFirst(["q-" + QUICK[0].id]); announce(quickVerdict().title); break;
    case "retry-save": retryFailed(); break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.sheetOpen) closeSheet();
});

/* 열어 둔 채로 새벽 6시를 넘기거나, 다른 앱에서 돌아왔을 때 날짜를 다시 맞춘다 */
function scheduleRollover() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(6, 0, 5, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  setTimeout(() => { render(); scheduleRollover(); }, Math.min(next - now, 2147483000));
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
window.addEventListener("pageshow", () => render());

/* ── 시작 ── */
function sanitizeDraft(x) {
  if (!x || typeof x !== "object" || x.k !== todayKey()) return null;
  const d = newDraft(x.k);
  if (Number.isInteger(x.gut) && x.gut >= 0 && x.gut <= 10) d.gut = x.gut;
  if (SLEEP_H.some((o) => o.id === x.sleepH)) d.sleepH = x.sleepH;
  if (WAKE.some((o) => o.id === x.wake)) d.wake = x.wake;
  if (MOVE.some((o) => o.id === x.move)) d.move = x.move;
  if (PUSHED.some((o) => o.n === x.pushed)) d.pushed = x.pushed;
  if (PLANNED.some((o) => o.n === x.planned)) d.planned = x.planned;
  if (Array.isArray(x.rhythm)) d.rhythm = x.rhythm.filter((id) => RHYTHM.some((o) => o.id === id));
  if (USED.some((o) => o.id === x.used)) d.used = x.used;
  if (Array.isArray(x.flags)) d.flags = x.flags.filter((f) => ALL_FLAGS.has(f));
  if (Number.isInteger(x.step) && x.step >= 0 && x.step <= LAST_STEP) d.step = x.step;
  d.showUsed = !!x.showUsed || d.showUsed;
  d.pushedFromLog = !!x.pushedFromLog;
  d.dayChanged = !!x.dayChanged;
  return d;
}
function boot(data) {
  let saved = null;
  try { saved = data ? clone(data) : null; } catch (e) { saved = null; }
  if (saved) {
    state.draft = sanitizeDraft(saved.draft);
    state.sheetOpen = !!(state.draft && saved.sheetOpen);
    if (Array.isArray(saved.quick)) state.quick = new Set(saved.quick.filter((q) => QUICK.some((x) => x.id === q)));
  }
  renderHow();
  render();
  connect();
  try {
    renderSheet();
  } catch (e) {
    state.draft = null;
    state.sheetOpen = false;
    renderSheet();
  }
  scheduleRollover();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ draft: state.draft, sheetOpen: state.sheetOpen, quick: [...state.quick] }));
  if (hot && typeof hot.ready === "function") hot.ready(boot);
  else boot((hot && hot.data) || {});
} catch (e) {
  boot({});
}
/* 확인용 (CLAUDE.md 참고) */
window.__energy = { computeResult, dayKey, levelOf, state, render, askDay };
})();
